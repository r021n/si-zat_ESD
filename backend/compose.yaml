name: si-zat-esd-backend

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: si-zat-esd-backend:latest
    container_name: si-zat-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:3000"
    env_file:
      - path: .env
        required: true
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: 0.0.0.0
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
